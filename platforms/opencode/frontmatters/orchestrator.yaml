    effect: ask
  - action: shell
    resource: "*|git tag*"
    effect: ask
  - action: shell
    resource: "*$(git tag*"
    effect: ask
  - action: shell
    resource: "*`git tag*"
    effect: ask
  - action: shell
    resource: "git -C * tag *"
    effect: ask
  - action: shell
    resource: "* git -C * tag *"
    effect: ask
  # Tag listing is a read. It sits after the tag asks so it wins on opencode
  # (last match wins); the tag delete denies stay at the end of the file.
  - action: shell
    resource: "git tag"
    effect: allow
  - action: shell
    resource: "git tag -l*"
    effect: allow
  - action: shell
    resource: "git tag --list*"
    effect: allow
  - action: shell
    resource: "git -C * tag -l*"
    effect: allow
  - action: shell
    resource: "git -C * tag --list*"
    effect: allow
  # Reviewed exact-flag read allows. Each form is literal (no `*`), so the raw
  # command must match the whole form. The block sits after the tag asks (last
  # match wins) and before the escape/chain guards, so a guard still wins. The
  # remaining reviewed reads already have exact allows above: `git ls-files`,
  # `git branch`, `git branch -a`, `git branch -r`,
  # `git branch --show-current`, `git reflog`, `git remote -v`,
  # `git config --list`, `git stash list`, `git notes list`,
  # `git worktree list`, `git submodule status`, and `git commit-graph verify`.
  - action: shell
    resource: "git status -s"
    effect: allow
  - action: shell
    resource: "git status --short"
    effect: allow
  - action: shell
    resource: "git status --porcelain"
    effect: allow
  - action: shell
    resource: "git log --oneline"
    effect: allow
  - action: shell
    resource: "git log --stat"
    effect: allow
  - action: shell
    resource: "git diff --stat"
    effect: allow
  - action: shell
    resource: "git diff --cached"
    effect: allow
  - action: shell
    resource: "git diff --name-only"
    effect: allow
  - action: shell
    resource: "git show --stat"
    effect: allow
  - action: shell
    resource: "git describe --tags"
    effect: allow
  - action: shell
    resource: "git shortlog -s"
    effect: allow
  - action: shell
    resource: "git tag -l"
    effect: allow
  - action: shell
    resource: "git tag --list"
    effect: allow
  # Option-based execution or file writes on an allowed read verb. These carry
  # no shell separator, so the chain guards cannot see them. The ask sits after
  # the read allows (last match wins) so a normal read still allows.
  - action: shell
    resource: "*grep -O*"
    effect: ask
  - action: shell
    resource: "*grep --open-files-in-pager*"
    effect: ask
  - action: shell
    resource: "*--output=*"
    effect: ask
  - action: shell
    resource: "*--output *"
    effect: ask
  - action: shell
    resource: "*--ext-diff*"
    effect: ask
  - action: shell
    resource: "*--textconv*"
    effect: ask
  - action: shell
    resource: "*--filters*"
    effect: ask
  # Chain guards. opencode matches the raw command string and the last match
  # wins, so a trailing-`*` read allow covers the whole chain (for example
  # `git grep x && git rm -rf y`). Every guard sits after the read allows and
  # before the explicit denies, so a plain read with no separator still allows,
  # any chain falls to ask, and a chained tag delete still denies at the end.
  - action: shell
    resource: "*;*"
    effect: ask
  - action: shell
    resource: "*&*"
    effect: ask
  - action: shell
    resource: "*|*"
    effect: ask
  - action: shell
    resource: "*>*"
    effect: ask
  - action: shell
    resource: "*$(*"
    effect: ask
  - action: shell
    resource: "*`*"
    effect: ask
  - action: shell
    resource: "*\n*"
    effect: ask
  # Process substitution carries no guarded separator. `>(...)` is caught by
  # the `*>*` guard; `<(...)` and zsh `=(...)` need their own guards.
  - action: shell
    resource: "*<(*"
    effect: ask
  - action: shell
    resource: "*=(*"
    effect: ask
  # Force-move is never a silent allow, even after a listing flag such as -l.
  - action: shell
    resource: "*git*tag*-f*"
    effect: ask
  - action: shell
    resource: "*git*tag*--force*"
    effect: ask
  - action: shell
    resource: "git branch -f*"
    effect: ask
  - action: shell
