description: "{{AGENT_DESCRIPTION}}"
mode: primary
permissions:
  - action: "*"
    resource: "*"
    effect: ask
  - action: external_directory
    resource: "*"
    effect: ask
  - action: external_directory
    resource: "~/.config/opencode/*"
    effect: allow
  - action: external_directory
    resource: "~/.config/opencode/**"
    effect: allow
  - action: external_directory
    resource: "~/agent-notes/orchestrator/*"
    effect: allow
  - action: external_directory
    resource: "~/agent-notes/orchestrator/**"
    effect: allow
  - action: external_directory
    resource: "~/agent-notes/project-notes/*"
    effect: allow
  - action: external_directory
    resource: "~/agent-notes/project-notes/**"
    effect: allow
  - action: external_directory
    resource: "~/agent-notes/researcher/reports/*"
    effect: allow
  - action: external_directory
    resource: "~/agent-notes/researcher/reports/**"
    effect: allow
  - action: edit
    resource: "*"
    effect: deny
  - action: edit
    resource: "~/agent-notes/orchestrator/*"
    effect: allow
  - action: edit
    resource: "~/agent-notes/orchestrator/**"
    effect: allow
  - action: edit
    resource: "~/agent-notes/project-notes/*"
    effect: allow
  - action: edit
    resource: "~/agent-notes/project-notes/**"
    effect: allow
  # The /tmp scratch zone allows the external_directory and edit actions.
  # These entries sit after the broad rule for each action, so the last match
  # wins. Residual: a symlink in the world-writable folder can point outside
  # the zone. The owner accepted this risk.
  - action: external_directory
    resource: "/tmp"
    effect: allow
  - action: external_directory
    resource: "/tmp/*"
    effect: allow
  - action: external_directory
    resource: "/tmp/**"
    effect: allow
  - action: edit
    resource: "/tmp"
    effect: allow
  - action: edit
    resource: "/tmp/*"
    effect: allow
  - action: edit
    resource: "/tmp/**"
    effect: allow
  - action: glob
    resource: "*"
    effect: allow
  - action: grep
    resource: "*"
    effect: allow
  - action: question
    resource: "*"
    effect: allow
  - action: read
    resource: "*"
    effect: allow
  - action: shell
    resource: "*"
    effect: ask
  - action: shell
    resource: "bash -n"
    effect: allow
  - action: shell
    resource: "bash -c *"
    effect: ask
  - action: shell
    resource: "cat"
    effect: allow
  - action: shell
    resource: "cat *>*"
    effect: ask
  - action: shell
    resource: "date"
    effect: allow
  - action: shell
    resource: "date +%Y%m%dT%H%M%S%N"
    effect: allow
  - action: shell
    resource: "date -u +%Y-%m-%dT%H:%M:%SZ"
    effect: allow
  - action: shell
    resource: "bash ~/.config/opencode/skills/common/journal-management-generic/scripts/journal-write.sh *"
    effect: allow
  # The trailing star also matches a separator tail, so a call such as
  # `journal-write.sh append; cp x y` would match the allow. The cp, mv, and
  # rsync asks are anchored at the command start and cannot see a tail, and an
  # unmatched tail command (rm) has no later entry, so the allow would run it.
  # These asks sit after the allow because the last match wins.
  - action: shell
    resource: "*journal-write.sh*;*"
    effect: ask
  - action: shell
    resource: "*journal-write.sh*&&*"
    effect: ask
  - action: shell
    resource: "*journal-write.sh*|*"
    effect: ask
  - action: shell
    resource: "*journal-write.sh*&*"
    effect: ask
  - action: shell
    resource: "*journal-write.sh*$(*"
    effect: ask
  - action: shell
    resource: "*journal-write.sh*`*"
    effect: ask
  # The journal allow takes any argument, and the script honors --home, so a
  # call could write outside the declared agent folder. The ask sits after the
  # allow entry because the last match wins.
  # --agent needs no ask. The value must match ^[a-z][a-z0-9-]*$. It selects a
  # sibling journal folder only. The block must sit in that folder's incoming
  # path and carry that agent's stamp, so orchestrator text cannot cross.
  - action: shell
    resource: "*journal-write.sh*--home*"
    effect: ask
  - action: shell
    resource: "diff"
    effect: allow
  - action: shell
    resource: "echo"
    effect: allow
  - action: shell
    resource: "echo *>*"
    effect: ask
  - action: shell
    resource: "find"
    effect: allow
  - action: shell
    resource: "git status"
    effect: allow
  - action: shell
    resource: "git log"
    effect: allow
  - action: shell
    resource: "git diff"
    effect: allow
  - action: shell
    resource: "git show"
    effect: allow
  - action: shell
    resource: "git add *"
    effect: ask
  - action: shell
    resource: "git branch --show-current"
    effect: allow
  - action: shell
    resource: "git branch -a"
    effect: allow
  - action: shell
    resource: "git branch -r"
    effect: allow
  - action: shell
    resource: "git -C"
    effect: allow
  - action: shell
    resource: "git -C * push *"
    effect: ask
  - action: shell
    resource: "git -C * pull *"
    effect: ask
  - action: shell
    resource: "git -C * push"
    effect: ask
  - action: shell
    resource: "git -C * pull"
    effect: ask
  - action: shell
    resource: "git commit *"
    effect: ask
  - action: shell
    resource: "git reset --soft *"
    effect: ask
  - action: shell
    resource: "git rev-parse"
    effect: allow
  - action: shell
    resource: "git cat-file"
    effect: allow
  - action: shell
    resource: "git rev-list"
    effect: allow
  # Tier A: pure read-only verbs. Only the bare form and the reviewed exact
  # forms (below, after the tag asks) allow. A free argument would let the raw
  # match ride an escape or a chain past the guards, so every argument-bearing
  # form asks.
  - action: shell
    resource: "git grep"
    effect: allow
  - action: shell
    resource: "git describe"
    effect: allow
  - action: shell
    resource: "git blame"
    effect: allow
  - action: shell
    resource: "git annotate"
    effect: allow
  - action: shell
    resource: "git shortlog"
    effect: allow
  - action: shell
    resource: "git whatchanged"
    effect: allow
  - action: shell
    resource: "git ls-files"
    effect: allow
  - action: shell
    resource: "git ls-tree"
    effect: allow
  - action: shell
    resource: "git show-ref"
    effect: allow
  - action: shell
    resource: "git for-each-ref"
    effect: allow
  - action: shell
    resource: "git name-rev"
    effect: allow
  - action: shell
    resource: "git check-ignore"
    effect: allow
  - action: shell
    resource: "git check-attr"
    effect: allow
  - action: shell
    resource: "git check-ref-format"
    effect: allow
  - action: shell
    resource: "git diff-tree"
    effect: allow
  - action: shell
    resource: "git diff-index"
    effect: allow
  - action: shell
    resource: "git diff-files"
    effect: allow
  - action: shell
    resource: "git cherry"
    effect: allow
  - action: shell
    resource: "git range-diff"
    effect: allow
  - action: shell
    resource: "git var"
    effect: allow
  - action: shell
    resource: "git version"
    effect: allow
  - action: shell
    resource: "git help"
    effect: allow
  - action: shell
    resource: "git show-branch"
    effect: allow
  - action: shell
    resource: "git get-tar-commit-id"
    effect: allow
  - action: shell
    resource: "git check-mailmap"
    effect: allow
  - action: shell
    resource: "git patch-id"
    effect: allow
  - action: shell
    resource: "git stripspace"
    effect: allow
  - action: shell
    resource: "git column"
    effect: allow
  - action: shell
    resource: "git count-objects"
    effect: allow
  - action: shell
    resource: "git verify-commit"
    effect: allow
  - action: shell
    resource: "git verify-tag"
    effect: allow
  - action: shell
    resource: "git verify-pack"
    effect: allow
  # fsck writes dangling objects only under `--lost-found`; hash-object writes
  # only under `-w`/`--write`. Only exact read forms allow; the write forms ask.
  - action: shell
    resource: "git fsck"
    effect: allow
  - action: shell
    resource: "git hash-object"
    effect: allow
  - action: shell
    resource: "git hash-object --stdin"
    effect: allow
  - action: shell
    resource: "git commit-graph verify"
    effect: allow
  - action: shell
    resource: "git multi-pack-index verify"
    effect: allow
  # `git -C *` forms of the exact reads. Only fsck and the two verify verbs
  # keep a `-C` form; the argument-bearing `-C * <verb> *` allows are gone.
  - action: shell
    resource: "git -C * fsck"
    effect: allow
  - action: shell
    resource: "git -C * commit-graph verify"
    effect: allow
  - action: shell
    resource: "git -C * multi-pack-index verify"
    effect: allow
  # Tier B: mutation-capable verbs. Only listing/inspection forms allow.
  - action: shell
    resource: "git branch"
    effect: allow
  - action: shell
    resource: "git branch -l"
    effect: allow
  - action: shell
    resource: "git branch --list"
    effect: allow
  - action: shell
    resource: "git branch -v"
    effect: allow
  - action: shell
    resource: "git branch -vv"
    effect: allow
  # A branch allow must not carry a free token after an option. opencode's
  # last-match glob would swallow a trailing branch name, and
  # `git branch --format=%(refname) newbranch` creates a branch. Every option
  # that needs an argument (`--format`, `--contains`, `--merged`, and the
  # `--no-*`/`--points-at` twins) asks by omission. Only the exact list forms
  # above and the `-C` list forms below allow.
  - action: shell
    resource: "git -C * branch -l"
    effect: allow
  - action: shell
    resource: "git -C * branch --list"
    effect: allow
  - action: shell
    resource: "git reflog"
    effect: allow
  - action: shell
    resource: "git reflog show"
    effect: allow
  - action: shell
    resource: "git reflog show *"
    effect: allow
  - action: shell
    resource: "git reflog exists"
    effect: allow
  - action: shell
    resource: "git reflog exists *"
    effect: allow
  - action: shell
    resource: "git remote"
    effect: allow
  - action: shell
    resource: "git remote -v"
    effect: allow
  - action: shell
    resource: "git remote --verbose"
    effect: allow
  - action: shell
    resource: "git remote get-url"
    effect: allow
  - action: shell
    resource: "git remote get-url *"
    effect: allow
  - action: shell
    resource: "git config --get"
    effect: allow
  - action: shell
    resource: "git config --get *"
    effect: allow
  - action: shell
    resource: "git config --get-all"
    effect: allow
  - action: shell
    resource: "git config --get-all *"
    effect: allow
  - action: shell
    resource: "git config --get-regexp"
    effect: allow
  - action: shell
    resource: "git config --get-regexp *"
    effect: allow
  - action: shell
    resource: "git config --get-urlmatch"
    effect: allow
  - action: shell
    resource: "git config --get-urlmatch *"
    effect: allow
  - action: shell
    resource: "git config -l"
    effect: allow
  - action: shell
    resource: "git config --list"
    effect: allow
  - action: shell
    resource: "git config --show-origin"
    effect: allow
  - action: shell
    resource: "git config --show-scope"
    effect: allow
  - action: shell
    resource: "git symbolic-ref HEAD"
    effect: allow
  - action: shell
    resource: "git symbolic-ref --short HEAD"
    effect: allow
  - action: shell
    resource: "git symbolic-ref -q HEAD"
    effect: allow
  - action: shell
    resource: "git stash list"
    effect: allow
  - action: shell
    resource: "git stash list *"
    effect: allow
  - action: shell
    resource: "git stash show"
    effect: allow
  - action: shell
    resource: "git stash show *"
    effect: allow
  - action: shell
    resource: "git notes list"
    effect: allow
  - action: shell
    resource: "git notes list *"
    effect: allow
  - action: shell
    resource: "git notes show"
    effect: allow
  - action: shell
    resource: "git notes show *"
    effect: allow
  - action: shell
    resource: "git worktree list"
    effect: allow
  - action: shell
    resource: "git worktree list *"
    effect: allow
  - action: shell
    resource: "git submodule status"
    effect: allow
  - action: shell
    resource: "git submodule status *"
    effect: allow
  - action: shell
    resource: "git submodule summary"
    effect: allow
  - action: shell
    resource: "git submodule summary *"
    effect: allow
  - action: shell
    resource: "git sparse-checkout list"
    effect: allow
  - action: shell
    resource: "git sparse-checkout list *"
    effect: allow
  - action: shell
    resource: "gh --version"
    effect: allow
  - action: shell
    resource: "gh auth status"
    effect: allow
  - action: shell
    resource: "grep"
    effect: allow
  - action: shell
    resource: "head"
    effect: allow
  - action: shell
    resource: "jq"
    effect: allow
  - action: shell
    resource: "ls"
    effect: allow
  - action: shell
    resource: "mkdir"
    effect: allow
  - action: shell
    resource: "pwd"
    effect: allow
  - action: shell
    resource: "ruff"
    effect: allow
  - action: shell
    resource: "sort"
    effect: allow
  - action: shell
    resource: "tail"
    effect: allow
  - action: shell
    resource: "tr"
    effect: allow
  - action: shell
    resource: "uniq"
    effect: allow
  - action: shell
    resource: "wc"
    effect: allow
  - action: shell
    resource: "which"
    effect: allow
  - action: shell
    resource: "cargo nextest *"
    effect: allow
  - action: shell
    resource: "cargo deny check *"
    effect: allow
  # A cargo config override can redirect the toolchain; deny it after the allows.
  - action: shell
    resource: "*cargo *--config*"
    effect: deny
  - action: shell
    resource: "xargs *"
    effect: ask
  - action: shell
    resource: "cp *"
    effect: ask
  - action: shell
    resource: "mv *"
    effect: ask
  - action: shell
    resource: "rsync *"
    effect: ask
  - action: shell
    resource: "git push *"
    effect: ask
  - action: shell
    resource: "git pull *"
    effect: ask
  - action: shell
    resource: "git merge"
    effect: ask
  - action: shell
    resource: "git merge *"
    effect: ask
  - action: shell
    resource: "* git merge"
    effect: ask
  - action: shell
    resource: "* git merge *"
    effect: ask
  - action: shell
    resource: "*;git merge"
    effect: ask
  - action: shell
    resource: "*&&git merge"
    effect: ask
  - action: shell
    resource: "*|git merge"
    effect: ask
  - action: shell
    resource: "*;git merge *"
    effect: ask
  - action: shell
    resource: "*&&git merge *"
    effect: ask
  - action: shell
    resource: "*|git merge *"
    effect: ask
  - action: shell
    resource: "gh pr *"
    effect: ask
  - action: shell
    resource: "gh release *"
    effect: ask
  - action: shell
    resource: "* git add"
    effect: ask
  - action: shell
    resource: "* git add *"
    effect: ask
  - action: shell
    resource: "* git commit"
    effect: ask
  - action: shell
    resource: "* git commit *"
    effect: ask
  - action: shell
    resource: "* git push"
    effect: ask
  - action: shell
    resource: "* git push *"
    effect: ask
  - action: shell
    resource: "* git pull"
    effect: ask
  - action: shell
    resource: "* git pull *"
    effect: ask
  - action: shell
    resource: "* gh pr"
    effect: ask
  - action: shell
    resource: "* gh pr *"
    effect: ask
  - action: shell
    resource: "* gh release *"
    effect: ask
  - action: shell
    resource: "* git -C * add"
    effect: ask
  - action: shell
    resource: "* git -C * add *"
    effect: ask
  - action: shell
    resource: "* git -C * commit"
    effect: ask
  - action: shell
    resource: "* git -C * commit *"
    effect: ask
  - action: shell
    resource: "* git -C * push"
    effect: ask
  - action: shell
    resource: "* git -C * push *"
    effect: ask
  - action: shell
    resource: "* git -C * pull"
    effect: ask
  - action: shell
    resource: "* git -C * pull *"
    effect: ask
  - action: shell
    resource: "git tag *"
    effect: ask
  - action: shell
    resource: "* git tag *"
    effect: ask
  - action: shell
    resource: "*;git tag*"
    effect: ask
  - action: shell
    resource: "*&&git tag*"
    effect: ask
  - action: shell
    resource: "*|git tag*"
    effect: ask
  - action: shell
    resource: "*$(git tag*"
    effect: ask
  - action: shell
    resource: "*`git tag*"
    effect: ask
  - action: shell
    resource: "git -C * tag *"
    effect: ask
  - action: shell
    resource: "* git -C * tag *"
    effect: ask
  # Tag listing is a read. It sits after the tag asks so it wins on opencode
  # (last match wins); the tag delete denies stay at the end of the file.
  - action: shell
    resource: "git tag"
    effect: allow
  - action: shell
    resource: "git tag -l*"
    effect: allow
  - action: shell
    resource: "git tag --list*"
    effect: allow
  - action: shell
    resource: "git -C * tag -l*"
    effect: allow
  - action: shell
    resource: "git -C * tag --list*"
    effect: allow
  # Reviewed exact-flag read allows. Each form is literal (no `*`), so the raw
  # command must match the whole form. The block sits after the tag asks (last
  # match wins) and before the escape/chain guards, so a guard still wins. The
  # remaining reviewed reads already have exact allows above: `git ls-files`,
  # `git branch`, `git branch -a`, `git branch -r`,
  # `git branch --show-current`, `git reflog`, `git remote -v`,
  # `git config --list`, `git stash list`, `git notes list`,
  # `git worktree list`, `git submodule status`, and `git commit-graph verify`.
  - action: shell
    resource: "git status -s"
    effect: allow
  - action: shell
    resource: "git status --short"
    effect: allow
  - action: shell
    resource: "git status --porcelain"
    effect: allow
  - action: shell
    resource: "git log --oneline"
    effect: allow
  - action: shell
    resource: "git log --stat"
    effect: allow
  - action: shell
    resource: "git diff --stat"
    effect: allow
  - action: shell
    resource: "git diff --cached"
    effect: allow
  - action: shell
    resource: "git diff --name-only"
    effect: allow
  - action: shell
    resource: "git show --stat"
    effect: allow
  - action: shell
    resource: "git describe --tags"
    effect: allow
  - action: shell
    resource: "git shortlog -s"
    effect: allow
  - action: shell
    resource: "git tag -l"
    effect: allow
  - action: shell
    resource: "git tag --list"
    effect: allow
  # Option-based execution or file writes on an allowed read verb. These carry
  # no shell separator, so the chain guards cannot see them. The ask sits after
  # the read allows (last match wins) so a normal read still allows.
  - action: shell
    resource: "*grep -O*"
    effect: ask
  - action: shell
    resource: "*grep --open-files-in-pager*"
    effect: ask
  - action: shell
    resource: "*--output=*"
    effect: ask
  - action: shell
    resource: "*--output *"
    effect: ask
  - action: shell
    resource: "*--ext-diff*"
    effect: ask
  - action: shell
    resource: "*--textconv*"
    effect: ask
  - action: shell
    resource: "*--filters*"
    effect: ask
  # Chain guards. opencode (v2.1.2) parses the command with tree-sitter and
  # matches each command node on its own; the node text keeps env assignments
  # and redirects, and a command inside `&&`, `;`, `|`, or `$(...)` is a
  # separate resource. The last match wins. These guards are defense in depth
  # for a node text that still holds a separator or an expansion (and for an
  # older raw-string matcher). Every guard sits after the read allows and
  # before the explicit denies, so a plain read with no separator still allows,
  # and a tag delete still denies at the end.
  - action: shell
    resource: "*;*"
    effect: ask
  - action: shell
    resource: "*&*"
    effect: ask
  - action: shell
    resource: "*|*"
    effect: ask
  - action: shell
    resource: "*>*"
    effect: ask
  - action: shell
    resource: "*$(*"
    effect: ask
  - action: shell
    resource: "*`*"
    effect: ask
  - action: shell
    resource: "*\n*"
    effect: ask
  # Process substitution carries no guarded separator. `>(...)` is caught by
  # the `*>*` guard; `<(...)` and zsh `=(...)` need their own guards.
  - action: shell
    resource: "*<(*"
    effect: ask
  - action: shell
    resource: "*=(*"
    effect: ask
  # Force-move is never a silent allow, even after a listing flag such as -l.
  - action: shell
    resource: "*git*tag*-f*"
    effect: ask
  - action: shell
    resource: "*git*tag*--force*"
    effect: ask
  - action: shell
    resource: "git branch -f*"
    effect: ask
  - action: shell
    resource: "git branch -D*"
    effect: ask
  - action: shell
    resource: "git branch -m*"
    effect: ask
  - action: shell
    resource: "git branch -M*"
    effect: ask
  - action: shell
    resource: "git branch --delete*"
    effect: ask
  - action: shell
    resource: "git branch --force*"
    effect: ask
  - action: shell
    resource: "git branch --move*"
    effect: ask
  - action: shell
    resource: "git branch --copy*"
    effect: ask
  - action: shell
    resource: "* git branch -f*"
    effect: ask
  - action: shell
    resource: "* git branch -D*"
    effect: ask
  - action: shell
    resource: "* git branch -m*"
    effect: ask
  - action: shell
    resource: "* git branch -M*"
    effect: ask
  - action: shell
    resource: "* git branch --delete*"
    effect: ask
  - action: shell
    resource: "* git branch --force*"
    effect: ask
  - action: shell
    resource: "* git branch --move*"
    effect: ask
  - action: shell
    resource: "* git branch --copy*"
    effect: ask
  - action: shell
    resource: "git branch -d*"
    effect: ask
  - action: shell
    resource: "git branch -c*"
    effect: ask
  - action: shell
    resource: "git branch -C*"
    effect: ask
  - action: shell
    resource: "* git branch -d*"
    effect: ask
  - action: shell
    resource: "* git branch -c*"
    effect: ask
  - action: shell
    resource: "* git branch -C*"
    effect: ask
  # Branch creation by name asks by omission (no branch allow matches it, and
  # the option-bearing branch allows no longer carry a free token). These
  # explicit asks cover the upstream/tracking/edit flags.
  - action: shell
    resource: "git branch -u*"
    effect: ask
  - action: shell
    resource: "git branch --set-upstream*"
    effect: ask
  - action: shell
    resource: "git branch --unset-upstream*"
    effect: ask
  - action: shell
    resource: "git branch -t*"
    effect: ask
  - action: shell
    resource: "git branch --track*"
    effect: ask
  - action: shell
    resource: "git branch --edit-description*"
    effect: ask
  - action: shell
    resource: "* git branch -u*"
    effect: ask
  - action: shell
    resource: "* git branch --set-upstream*"
    effect: ask
  # Space-before flag guards: an upstream flag after a listing value
  # (`git branch --format=x -u y`) must still ask.
  - action: shell
    resource: "*git*branch* -u*"
    effect: ask
  - action: shell
    resource: "*git*branch* --set-upstream*"
    effect: ask
  - action: shell
    resource: "*git*branch* --unset-upstream*"
    effect: ask
  - action: shell
    resource: "*git*branch* -t*"
    effect: ask
  - action: shell
    resource: "*git*branch* --track*"
