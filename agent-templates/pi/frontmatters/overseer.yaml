name: overseer
description: Patrols agent status and panes via herdr and keeps the captain's log in agent-notes. Acts autonomously inside the user's stated scope; asks only outside that scope or for user data or configuration.
# Not spawnable as a subagent: overseer is a main-session monitor, and its herdr
# access must not leak into delegated contexts.
spawnable: false
# pi has no fetch/webfetch tool, so the opencode template's webfetch allows for
# herdr.dev / raw.githubusercontent.com intentionally do not exist here.
tools: [bash, read, edit, write, find, ls, grep, ask_user_question]
skills: ["overseer/*", "common/journal-management-generic", "common/simplified-technical-english", "common/persona-free-documents", "common/shell-discipline"]
alwaysLoad: ["common/journal-management-generic", "common/simplified-technical-english", "common/shell-discipline"]
permissions:
  mode: deny-by-default
  allow:
    - { tool: read, match: "." }
    - { tool: find, match: "." }
    - { tool: ls, match: "." }
    - { tool: grep, match: "." }
    - { tool: edit, match: "(^|/)agent-notes/overseer/" }
    - { tool: write, match: "(^|/)agent-notes/overseer/" }
    - { tool: ask_user_question, match: "." }
    # `sort` and `mkdir` write or run a program by option; no allow, so the default decides.
    - { tool: bash, match: "^(cat|head|tail|wc|grep|rg|ls|stat|od|pwd|date|diff|echo|printf|cut|sleep|whoami|which|command -v|jq|bash -n|test)\\b" }
    - { tool: bash, match: "^find\\b" }
    # `branch`, `grep`, and `ls-remote` write refs or run a pager or upload program.
    - { tool: bash, match: "^(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+-C\\s+\\S+)?\\s+(status|log|diff|show|rev-parse|remote)\\b" }
    - { tool: bash, match: "^(?:HERDR_ENV=1\\s+)?(?:[^\\s;|&()]*/\\.local/bin/)?herdr\\s+(?:--help|--version|status|machine\\s+list|(?:workspace|tab)\\s+(?:create|list|get)|workspace$|tab$|pane\\s+(?:list|get|current|split|read|wait-output|send-text|layout)|pane$|agent\\s+(?:list|get|rename|start|prompt|wait|read)|agent$)\\b" }
    - { tool: bash, match: "(?:HERDR_ENV=1\\s+)?(?:[^\\s;|&()]*/\\.local/bin/)?herdr\\s+pane\\s+send-keys\\b" }
    - { tool: bash, match: "(?:HERDR_ENV=1\\s+)?(?:[^\\s;|&()]*/\\.local/bin/)?herdr\\s+agent\\s+send-keys\\b" }
  ask:
    - { tool: bash, match: "(?:HERDR_ENV=1\\s+)?(?:[^\\s;|&()]*/\\.local/bin/)?herdr\\s+pane\\s+run\\b" }
    - { tool: bash, match: "(?:HERDR_ENV=1\\s+)?(?:[^\\s;|&()]*/\\.local/bin/)?herdr\\s+pane\\s+close\\b" }
  deny:
    - { tool: bash, match: "^eval\\b" }
    - { tool: bash, match: "^(?:/bin/)?(?:bash|sh|dash|zsh)\\s+-c\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+(push|pull)\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+(add|commit)\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?gh\\s+pr\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?gh\\s+release\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+branch\\b[^\\n]*\\s(?:-[a-zA-Z]*[fDmMdcC]\\b|--(?:delete|delet|dele|del|de|d|force|forc|for|move|mov|mo|copy|cop)\\b)" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+reflog\\s+(?:expire|delete|drop)\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+fetch\\b[^\\n]*:" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+remote\\s+(?:add|remove|rm|rename|set-url|set-branches|set-head|prune|update)\\b" }
    - { tool: bash, match: "^find\\b.*-exec\\b" }
    - { tool: bash, match: "^find\\b.*-(?:delete|execdir|ok|okdir|fls|fprint(?:0|f)?)(?=[\\s;|&()]|$)" }
    - { tool: bash, match: "(?:^|[;&|(\\s])\\s*xargs(?:\\s+-[^\\s]+)*\\s(?:rm|sh|bash|zsh|mv|cp)(?:[\\s;|&()]|$)" }
    - { tool: bash, match: "curl\\b.*\\|\\s*(ba)?sh\\b" }
    - { tool: bash, match: "(?:>>|>)(?!&\\d(?=$|[\\s;&|()<>]))|(?:^|[;&|(\\s])\\s*tee\\s+" }
    # A read-only role must not create a directory or write a stream to a file.
    - { tool: bash, match: "^mkdir\\b" }
    - { tool: bash, match: "^sort\\b[^\\n]*\\s(?:-[A-Za-z]*o[A-Za-z]*|--o[A-Za-z-]*)" }
    - { tool: bash, match: "^uniq\\b[^\\n]*(?:\\s--(?:\\s|$)|[^\\n]*\\s[^-\\s]\\S*\\s+\\S+\\s*$)" }
    # The rg --pre option runs an external command.
    # The rg -z option runs an external decompression program.
    - { tool: bash, match: "^rg\\b[^\\n]*\\s(?:--pre(?:\\s|=)|-[A-Za-z]*z[A-Za-z]*\\b|--search-zip\\b)" }
    # `date -s` sets the system clock.
    - { tool: bash, match: "^date\\b[^\\n]*\\s(?:-s[A-Za-z]*|--s[A-Za-z-]*)" }
    # `--output` writes a file.
    - { tool: bash, match: "^(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--no-pager|-p))*\\s+(?:log|rev-list|diff-tree|diff-index|diff-files|diff|show|whatchanged|cat-file|grep|blame|shortlog)\\b[^\\n]*\\s(?:--output(?:=\\S+)?|--ext-diff|--textconv|--filters)\\b" }
    # `git grep -O` / `--open-files-in-pager` runs the pager as a command.
    - { tool: bash, match: "^(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--no-pager|-p))*\\s+grep\\b[^\\n]*?\\s(?:-O\\S*|--open-files-in-pager(?:=\\S*)?)\\b" }
    # A branch create writes a ref; only the listing forms are read-only.
    - { tool: bash, match: "^(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--no-pager|-p))*\\s+branch\\b(?:[^\\n]*\\s(?:-(?:u|t)\\b|--(?:set-upstream(?:-to)?|unset-upstream|track|edit-description|tra|edit-descr)\\b)|\\s+(?!-)[^\\s;&|()]+)" }
    - { tool: bash, match: "^(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--no-pager|-p))*\\s+branch\\b[^\\n]*\\s--(?:format|(?:no-)?contains|(?:no-)?merged|points-at)\\b(?:=\\S+\\s+[^-\\s]\\S+|\\s+\\S+\\s+[^-\\s]\\S+)" }
    - { tool: bash, match: "\\bmkfs\\b|\\bdd\\b.*\\bof=/dev/|^sudo\\b" }
    - { tool: bash, match: "\\brm\\s+-[rf]{1,2}\\b" }
    - { tool: bash, match: "herdr\\b(?:[^;\"'|&]|(?:\"[^\"]*\"|'[^']*'))*(?:&&|\\|\\||[;&|]|\\r?\\n)[\\s\\S]*?herdr\\b(?=(?:[^\"']*[\"'][^\"']*[\"'])*[^\"']*$)" }
    - { tool: bash, match: "(?:\\$\\(|`)[\\s\\S]*?herdr\\b(?=(?:[^']*'[^']*')*[^']*$)" }
    - { tool: bash, match: "herdr\\b[^;\"']*(?:\\bserver\\b|\\bplugin\\b|--machine\\b)(?=(?:[^\"']*[\"'][^\"']*[\"'])*[^\"']*$)", noDequote: true }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|eval|command|sudo)\\s+)*(?:bash|sh|zsh|dash|ksh)\\s+[^\\n]*?herdr\\b" }
