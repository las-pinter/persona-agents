name: overseer
description: Patrols agent status and panes via herdr, keeps the captain's log in agent-notes, and asks before destructive acts
# Not spawnable as a subagent: overseer is a main-session monitor, and its herdr
# access must not leak into delegated contexts.
spawnable: false
# pi has no fetch/webfetch tool, so the opencode template's webfetch allows for
# herdr.dev / raw.githubusercontent.com intentionally do not exist here.
tools: [bash, read, edit, write, find, ls, grep, ask_user_question]
skills: ["overseer/*", "common/journal-management-generic", "common/simplified-technical-english"]
alwaysLoad: ["common/journal-management-generic", "common/simplified-technical-english"]
permissions:
  mode: deny-by-default
  allow:
    - { tool: read, match: "." }
    - { tool: find, match: "." }
    - { tool: ls, match: "." }
    - { tool: grep, match: "." }
    - { tool: edit, match: "(^|/)agent-notes/overseer/" }
    - { tool: write, match: "(^|/)agent-notes/overseer/" }
    - { tool: ask_user_question, match: "." }
    - { tool: bash, match: "^(cat|head|tail|sort|uniq|wc|grep|rg|ls|stat|od|pwd|date|diff|echo|printf|cut|sleep|whoami|which|command -v|jq|bash -n|mkdir|test)\\b" }
    - { tool: bash, match: "^find\\b" }
    - { tool: bash, match: "^(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+-C\\s+\\S+)?\\s+(status|log|diff|show|branch(--show-current|-a|-vv)?|rev-parse|ls-remote|remote|grep)\\b" }
    - { tool: bash, match: "^(?:HERDR_ENV=1\\s+)?(?:/home/dev/\\.local/bin/)?herdr\\s+(?:--help|--version|status|machine\\s+list|(?:workspace|tab)\\s+(?:create|list|get)|workspace$|tab$|pane\\s+(?:list|get|current|split|read|wait-output|send-text|layout)|pane$|agent\\s+(?:list|get|rename|start|prompt|wait|read)|agent$)\\b" }
    - { tool: bash, match: "(?:HERDR_ENV=1\\s+)?(?:/home/dev/\\.local/bin/)?herdr\\s+pane\\s+send-keys\\b" }
    - { tool: bash, match: "(?:HERDR_ENV=1\\s+)?(?:/home/dev/\\.local/bin/)?herdr\\s+agent\\s+send-keys\\b" }
  ask:
    - { tool: bash, match: "(?:HERDR_ENV=1\\s+)?(?:/home/dev/\\.local/bin/)?herdr\\s+pane\\s+run\\b" }
    - { tool: bash, match: "(?:HERDR_ENV=1\\s+)?(?:/home/dev/\\.local/bin/)?herdr\\s+pane\\s+close\\b" }
  deny:
    - { tool: bash, match: "^eval\\b" }
    - { tool: bash, match: "^(?:/bin/)?(?:bash|sh|dash|zsh)\\s+-c\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+(push|pull)\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+(add|commit)\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?gh\\s+pr\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+branch\\b[^\\n]*\\s(?:-[a-zA-Z]*[fDmMdcC]\\b|--(?:delete|delet|dele|del|de|d|force|forc|for|move|mov|mo|copy|cop)\\b)" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+reflog\\s+(?:expire|delete|drop)\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+fetch\\b[^\\n]*:" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|command|sudo)(?:\\s+-\\S+(?:\\s+[^-\\s]\\S*)?)*\\s+|[A-Za-z_][A-Za-z0-9_]*=\\S+\\s+)*(?:cd\\s+\\S+\\s*&&\\s*)?git(?:\\s+(?:-C\\s+\\S+|--?[A-Za-z][A-Za-z0-9-]*(?:=\\S+)?))*\\s+remote\\s+(?:add|remove|rm|rename|set-url|set-branches|set-head|prune)\\b" }
    - { tool: bash, match: "^find\\b.*-exec\\b" }
    - { tool: bash, match: "^find\\b.*-(?:delete|execdir|ok|okdir|fls|fprint(?:0|f)?)(?=[\\s;|&()]|$)" }
    - { tool: bash, match: "(?:^|[;&|(\\s])\\s*xargs(?:\\s+-[^\\s]+)*\\s(?:rm|sh|bash|zsh|mv|cp)(?:[\\s;|&()]|$)" }
    - { tool: bash, match: "curl\\b.*\\|\\s*(ba)?sh\\b" }
    - { tool: bash, match: "(?:^|[;&|(\\s])\\s*(?:>>|>)(?![0-9&])\\s*[^0-9&\\s]|(?:^|[;&|(\\s])\\s*tee\\s+" }
    - { tool: bash, match: "\\bmkfs\\b|\\bdd\\b.*\\bof=/dev/|^sudo\\b" }
    - { tool: bash, match: "\\brm\\s+-[rf]{1,2}\\b" }
    - { tool: bash, match: "herdr\\b(?:[^;\"'|&]|(?:\"[^\"]*\"|'[^']*'))*(?:&&|\\|\\||[;&|]|\\r?\\n)[\\s\\S]*?herdr\\b(?=(?:[^\"']*[\"'][^\"']*[\"'])*[^\"']*$)" }
    - { tool: bash, match: "(?:\\$\\(|`)[\\s\\S]*?herdr\\b(?=(?:[^']*'[^']*')*[^']*$)" }
    - { tool: bash, match: "herdr\\b[^;\"']*(?:\\bserver\\b|\\bplugin\\b|--machine\\b)(?=(?:[^\"']*[\"'][^\"']*[\"'])*[^\"']*$)" }
    - { tool: bash, match: "(?:^|[;&|(\\n])\\s*(?:(?:env|time|nice|nohup|exec|eval|command|sudo)\\s+)*(?:bash|sh|zsh|dash|ksh)\\s+[^\\n]*?herdr\\b" }
