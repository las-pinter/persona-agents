  - action: external_directory
    resource: "~/agent-notes/planner/plans/**"
    effect: allow
  - action: external_directory
    resource: "~/agent-notes/researcher/studies/*"
    effect: allow
  - action: external_directory
    resource: "~/agent-notes/researcher/studies/**"
    effect: allow
  - action: edit
    resource: "*"
    effect: ask
  - action: edit
    resource: "~/agent-notes/orchestrator/*"
    effect: allow
  - action: edit
    resource: "~/agent-notes/orchestrator/**"
    effect: allow
  - action: edit
    resource: "~/agent-notes/planner/plans/*"
    effect: allow
