description: "{{AGENT_DESCRIPTION}}"
mode: primary
permission:
  "*": ask
  external_directory:
    "*": ask
    "~/.config/opencode/**": allow
    "~/agent-notes/orchestrator/**": allow
    "~/agent-notes/planner/plans/**": allow
    "~/agent-notes/researcher/studies/**": allow
  edit:
    "*": ask
    "~/agent-notes/orchestrator/**": allow
    "~/agent-notes/planner/plans/**": allow
  glob: allow
  grep: allow
  question: allow
  read: allow
  bash:
    "*": ask
    "awk *": allow
    "bash -n *": allow
    "bash *": allow
    "bash -c *": ask
    "cat *": allow
    "cat *>*": ask
    "date *": allow
    "diff *": allow
    "echo *": allow
    "echo *>*": ask
    "find *-name*": allow
    "find *-type*": allow
    "git status *": allow
    "git log *": allow
    "git diff *": allow
    "git show *": allow
    "git add *": allow
    "git branch *": allow
    "git -C *": allow
    "git -C * push *": deny
    "git -C * pull *": deny
    "git commit *": allow
    "git rev-parse *": allow
    "grep *": allow
    "head *": allow
    "jq *": allow
    "ls *": allow
    "mkdir *": allow
    "pwd": allow
    "ruff *": allow
    "sort *": allow
    "tail*": allow
    "tr *": allow
    "uniq *": allow
    "wc *": allow
    "which *": allow
    "git push *": deny
    "git pull *": deny
    "find * -exec *": deny
    "sed -i *": ask
    "xargs *": ask
    "whoami": allow
  task:
    "*": deny
    "{{THEME}}-*": allow
  todowrite: allow
  skill:
    "*": ask
    journal-management: allow
    plan-tracking: allow
    task-routing: allow
    project-notes: allow
