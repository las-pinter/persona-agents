description: "{{AGENT_DESCRIPTION}}"
mode: all
permissions:
  - action: "*"
    resource: "*"
    effect: deny
  - action: execute
    resource: "*"
    effect: allow
  - action: external_directory
    resource: "*"
    effect: ask
  - action: glob
    resource: "*"
    effect: allow
  - action: grep
    resource: "*"
    effect: allow
  - action: read
    resource: "*"
    effect: allow
  - action: shell
    resource: "*"
    effect: ask
  - action: shell
    resource: "awk *"
    effect: allow
  - action: shell
    resource: "bash -n *"
    effect: allow
  - action: shell
    resource: "cat*"
    effect: allow
  - action: shell
    resource: "cat *>*"
    effect: ask
  - action: shell
    resource: "cut *"
    effect: allow
  - action: shell
    resource: "date *"
    effect: allow
  - action: shell
    resource: "diff *"
    effect: allow
  - action: shell
    resource: "echo *"
    effect: allow
  - action: shell
    resource: "echo *>*"
    effect: ask
  - action: shell
    resource: "find *-name*"
    effect: allow
  - action: shell
    resource: "find *-type*"
    effect: allow
  - action: shell
    resource: "git status *"
    effect: allow
  - action: shell
    resource: "git log*"
    effect: allow
  - action: shell
    resource: "git diff *"
    effect: allow
  - action: shell
    resource: "git show*"
    effect: allow
  - action: shell
    resource: "git branch *"
    effect: allow
  - action: shell
    resource: "grep*"
    effect: allow
  - action: shell
    resource: "head *"
    effect: allow
  - action: shell
    resource: "jq*"
    effect: allow
  - action: shell
    resource: "ls *"
    effect: allow
  - action: shell
    resource: "mypy *"
    effect: allow
  - action: shell
    resource: "npm test *"
    effect: allow
  - action: shell
    resource: "od *"
    effect: allow
  - action: shell
    resource: "pwd"
    effect: allow
  - action: shell
    resource: "pytest *"
    effect: allow
  - action: shell
    resource: "ruff *"
    effect: allow
  - action: shell
    resource: "sort *"
    effect: allow
  - action: shell
    resource: "tail *"
    effect: allow
  - action: shell
    resource: "tr *"
    effect: allow
  - action: shell
    resource: "tsc *"
    effect: allow
  - action: shell
    resource: "uniq *"
    effect: allow
  - action: shell
    resource: "wc *"
    effect: allow
  - action: shell
    resource: "which*"
    effect: allow
  - action: shell
    resource: "xxd *"
    effect: allow
  - action: shell
    resource: "git push *"
    effect: deny
  - action: shell
    resource: "git pull *"
    effect: deny
  - action: shell
    resource: "find * -exec *"
    effect: deny
  - action: shell
    resource: "sed *"
    effect: allow
  - action: shell
    resource: "sed -i *"
    effect: ask
  - action: shell
    resource: "xargs *"
    effect: ask
  - action: subagent
    resource: "*"
    effect: deny
  - action: subagent
    resource: "{{THEME}}-researcher"
    effect: allow
  - action: skill
    resource: "*"
    effect: ask
  - action: skill
    resource: code-review-checklist
    effect: allow
