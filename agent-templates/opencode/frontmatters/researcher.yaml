    "jq *": allow
    "ls *": allow
    "pwd": allow
    "sort *": allow
    "tail*": allow
    "tr *": allow
    "uniq *": allow
    "wc *": allow
    "which *": allow
    "git push *": deny
    "git pull *": deny
    "find * -exec *": deny
