description: "{{AGENT_DESCRIPTION}}"
mode: all
temperature: 0.1
top_p: 0.95
permission:
  "*": deny
  code: allow
  edit:
    "*": ask
    "~/agent-notes/planner/**": allow
  external_directory: ask
  glob: allow
  grep: allow
  read: allow
  bash:
    "*": ask
    "awk *": allow
    "bash -n *": allow
    "cat *": allow
    "cat *>*": ask
    "date *": allow
    "diff *": allow
    "echo *": allow
    "echo *>*": ask
    "find *-name*": allow
    "find *-type*": allow
    "git status *": allow
    "git log*": allow
    "git diff *": allow
    "git show *": allow
    "grep *": allow
    "head *": allow
    "jq *": allow
    "ls *": allow
    "pwd": allow
    "sort *": allow
    "tail *": allow
    "tr *": allow
    "uniq*": allow
    "wc *": allow
    "which *": allow
    "git push *": deny
    "git pull *": deny
    "find * -exec *": deny
    "sed -i *": ask
    "xargs *": ask
  task:
    "*": deny
    "{{THEME}}-researcher": allow
  skill:
    "*": ask
    plan-output-template: allow
    risk-and-dependency-identification: allow
    task-decomposition: allow
