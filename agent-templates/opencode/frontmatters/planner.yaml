description: "{{AGENT_DESCRIPTION}}"
mode: "all"
temperature: 0.1
top_p: 0.95
permission:
  "*": "deny"
  "code": "allow"
  "edit":
    "*": "ask"
    "~/agent-notes/planner/**": "allow"
  "write":
    "*": "ask"
    "~/agent-notes/planner/**": "allow"
  "glob": "allow"
  "grep": "allow"
  "read": "allow"
  "bash":
    "*": "ask"
    "awk*": "allow"
    "bash -n *": "allow"
    "bash -n *;*": "deny"
    "bash -n *>*": "deny"
    "cat*": "allow"
    "cat *>*": "ask"
    "date *": "allow"
    "diff*": "allow"
    "find *-name*": "allow"
    "find *-type*": "allow"
    "git status *": "allow"
    "git log*": "allow"
    "git diff *": "allow"
    "git show*": "allow"
    "git branch *": "allow"
    "grep*": "allow"
    "head *": "allow"
    "jq*": "allow"
    "ls *": "allow"
    "pwd": "allow"
    "sort *": "allow"
    "tail*": "allow"
    "tr *": "allow"
    "uniq*": "allow"
    "wc *": "allow"
    "which*": "allow"
    "git push *": "deny"
    "git pull*": "deny"
    "find * -exec *": "deny"
    "sed -i *": "ask"
    "xargs *": "ask"
  "task":
    "*": "deny"
    "{{THEME}}-researcher": "allow"
  "skill":
    "*": "ask"
