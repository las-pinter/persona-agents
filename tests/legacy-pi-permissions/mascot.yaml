# Frozen legacy rule list, retired when the pi gate moved to the compiled table.
# See `orchestrator.yaml` in this folder. The gate never reads this file.
permissions:
  mode: deny-by-default
  allow:
    - { tool: read, match: "(^|/)(personas|skills|agents|agent-notes)/" }
  ask: []
  deny:
    - { tool: bash, match: "^eval\\b" }
    - { tool: bash, match: "^(?:/bin/)?(?:bash|sh|dash|zsh)\\s+-c\\b" }
    - { tool: bash, match: "(?:>>|>)(?!&\\d(?=$|[\\s;&|()<>]))|(?:^|[;&|(\\s])\\s*tee\\s+" }
